[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jamesian-layer"
version = "0.1.0"
description = "Autonomic interoceptive and agency-auditing middleware for foundation models"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "modal>=0.60",
    "typer>=0.9",
    "streamlit>=1.37",
    "plotly>=5.0",
]

[project.scripts]
agency-audit = "jamesian_layer.cli.main:app"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["jamesian_layer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
